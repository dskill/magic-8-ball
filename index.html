<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic 8 Ball</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1 class="game-title">Ask Magic 8 Ball</h1>
        </header>

        <div class="shader-container">
            <canvas id="shaderCanvas" class="shader-canvas" width="640" height="400"></canvas>
        </div>

        <div class="input-bar">
            <div class="input-group">
                <button id="pttButton" class="ptt-button ptt-idle" title="Hold to speak">
                    <span class="ptt-label">VOICE</span>
                </button>
                <input
                    type="text"
                    id="textInput"
                    class="question-input"
                    placeholder="Type your question..."
                    disabled
                />
            </div>
            <div class="status-bar">
                <span id="pttStatus" class="status-indicator"></span>
                <span id="pttTranscript" class="transcript"></span>
            </div>
        </div>

        <!-- Hidden elements for compatibility with main.js -->
        <div style="display:none">
            <span id="systemStatus">INITIALIZING</span>
            <span id="seekerName"></span>
            <span id="seekerZodiac"></span>
            <span id="pttDuration"></span>
            <span id="voiceIndicator"></span>
            <span id="voiceStatus"></span>
            <span id="voiceTranscript"></span>
        </div>

        <!-- Start overlay -->
        <div class="start-overlay" id="startOverlay">
            <div class="start-content">
                <div class="start-title">MAGIC 8 BALL</div>
                <div class="start-subtitle">This could have been a random number</div>

                <div class="start-form">
                    <div class="start-input-group">
                        <label for="playerNameInput" class="start-label">Your Name</label>
                        <input type="text" id="playerNameInput" class="start-input" placeholder="Enter your name..." />
                    </div>
                </div>

                <button id="startLoadBtn" class="start-load-button" disabled>[ CONSULT THE 8 BALL ]</button>
                
                <div class="model-list">
                    <div class="model-item">Qwen3-0.6B <span class="model-size">~150MB</span></div>
                    <div class="model-item">Whisper-tiny.en <span class="model-size">~40MB</span></div>
                    <div class="model-item">Supertonic-TTS <span class="model-size">~60MB</span></div>
                </div>
                
                <div class="privacy-note">All models run locally in your browser via WebGPU.<br>No data is collected or transmitted.</div>
            </div>
        </div>

        <!-- Hidden birthday input for compatibility -->
        <input type="hidden" id="playerBirthdayInput" value="" />

        <div class="loading-overlay hidden" id="loadingOverlay">
            <div class="loading-content">
                <div class="loading-title">SUMMONING SPIRITS</div>
                <div class="loading-bar">
                    <div class="loading-progress" id="loadingProgress"></div>
                </div>
                <div class="loading-status" id="loadingStatus">Invoking the oracle...</div>
            </div>
        </div>

        <div class="name-entry-overlay hidden" id="nameEntryOverlay">
            <div class="name-entry-content">
                <div class="name-entry-title">LOADING</div>
            </div>
        </div>
    </div>

    <script type="module" src="/main.js"></script>
</body>
</html>
